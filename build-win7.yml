name: Build for Windows 7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install Windows 7 SDK and Driver Build Tools
      run: |
        # Устанавливаем старые инструменты сборки C++ через пакетный менеджер choco
        choco install windows-sdk-7.1 vcredist2010 -y

    - name: Configure and Build Driver
      run: |
        # Запуск сборки с явным указанием старого набора инструментов (v100 или v141_xp)
        msbuild VmwareHardenedLoader.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v141_xp /p:TargetVersion=Win7
